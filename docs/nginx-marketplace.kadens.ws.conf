# Nginx config for marketplace.kadens.ws (HTTPS + PM2 dev servers)
# Copy to: /etc/nginx/sites-available/marketplace.kadens.ws
# Enable:  sudo ln -sf /etc/nginx/sites-available/marketplace.kadens.ws /etc/nginx/sites-enabled/
# Test:    sudo nginx -t && sudo systemctl reload nginx
#
# PM2: kadena-app (frontend) on 8081, kadena-server (backend) on 5050
# Env for backend: PORT=5050, CORS_ORIGINS=https://marketplace.kadens.ws
# If your domain is marketplace.kadena.ws, replace kadens.ws with kadena.ws in server_name and ssl_* paths.

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name marketplace.kadens.ws;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name marketplace.kadens.ws;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/marketplace.kadens.ws/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketplace.kadens.ws/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Allow profile image and chat file uploads (max ~5MB each)
    client_max_body_size 10M;

    # Backend API — no trailing slash so /api/profiles/... goes to 5050 as /api/profiles/...
    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # WebSocket (online status, chat)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files (avatars, chat attachments) — must proxy to backend
    location /uploads/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Vite dev server)
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
