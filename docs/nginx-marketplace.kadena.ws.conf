# Nginx fix for marketplace.kadena.ws — API 404
# Apply this change on the server at: /etc/nginx/sites-available/marketplace.kadena.ws
#
# In the block:
#   location /api/ {
#       proxy_pass http://127.0.0.1:5050/;   # Backend server
#
# Change to (remove trailing slash after 5050):
#   location /api/ {
#       proxy_pass http://127.0.0.1:5050;     # Backend server — no trailing slash!
#
# Why: With a trailing slash, Nginx replaces the matched prefix and sends
#      /api/profiles/xxx → http://127.0.0.1:5050/profiles/xxx
#      The Node app expects /api/profiles/xxx, so it returns 404.
#      Without the trailing slash, the full URI is passed: /api/profiles/xxx → 5050/api/profiles/xxx
#
# Then reload Nginx:
#   sudo nginx -t && sudo systemctl reload nginx
