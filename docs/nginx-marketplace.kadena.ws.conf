# Nginx config for marketplace.kadena.ws (production)
# Place at: /etc/nginx/sites-available/marketplace.kadena.ws
# Enable: sudo ln -sf /etc/nginx/sites-available/marketplace.kadena.ws /etc/nginx/sites-enabled/
# Test:   sudo nginx -t && sudo systemctl reload nginx
#
# Requirements:
# - Node backend: PORT=5050 (e.g. node server/index.js or npm run start with PORT=5050)
# - Frontend built and copied to /var/www/marketplace.kadena.ws (or change root below)
# - Env for Node server:
#     PORT=5050
#     CORS_ORIGINS=https://marketplace.kadena.ws
#     DATABASE_URL=postgresql://...
#   Without CORS_ORIGINS the server allows any origin (ok for same-host; set it in production).

server {
    listen 80;
    listen [::]:80;
    server_name marketplace.kadena.ws;

    # Optional: redirect HTTP to HTTPS (uncomment if using SSL)
    # return 301 https://$server_name$request_uri;
    # }
    # server {
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # server_name marketplace.kadena.ws;
    # ssl_certificate /etc/letsencrypt/live/marketplace.kadena.ws/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/marketplace.kadena.ws/privkey.pem;

    # Allow larger uploads (profile image, chat attachments; max 5MB each, 10M safe)
    client_max_body_size 10M;

    # Backend API — MUST NOT use trailing slash on proxy_pass so /api/* is passed as-is
    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Avoid buffering multipart/form-data (fixes profile image + chat file uploads)
        proxy_request_buffering off;
    }

    # WebSocket for online status and chat real-time
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files (avatars, chat attachments, dispute evidence) — served by Node
    location /uploads/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: serve built frontend (adjust root to your deploy path)
    root /var/www/marketplace.kadena.ws;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
