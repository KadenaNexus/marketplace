# Nginx config for marketplace.kadena.ws (HTTPS + PM2 dev servers)
# Copy to: /etc/nginx/sites-available/marketplace.kadena.ws
# Enable:  sudo ln -sf /etc/nginx/sites-available/marketplace.kadena.ws /etc/nginx/sites-enabled/
# Test:    sudo nginx -t && sudo systemctl reload nginx
#
# PM2: kadena-app (frontend) on 8081, kadena-server (backend) on 5050
# Env for backend: PORT=5050, CORS_ORIGINS=https://marketplace.kadena.ws
#
# If profile save fails with "Profile server unreachable", on the server run:
#   1) Backend up?   curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5050/api/profiles
#      (404 or 400 = backend OK; 000 or connection refused = start backend with PORT=5050)
#   2) Nginx proxy?  curl -s -o /dev/null -w "%{http_code}" https://marketplace.kadena.ws/api/profiles
#      (404/400 = proxy OK; 502 = Nginx can't reach backend; fix proxy_pass to http://127.0.0.1:5050 with NO trailing slash)
#   3) In location /api/ use: proxy_pass http://127.0.0.1:5050;   (no slash after 5050)
#
# If profile image or chat attachment still fail: try commenting out "proxy_request_buffering off"
# (some setups need buffering on for multipart to reach the backend).

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name marketplace.kadena.ws;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name marketplace.kadena.ws;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/marketplace.kadena.ws/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketplace.kadena.ws/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Allow profile image and chat file uploads (max ~5MB each)
    client_max_body_size 10M;

    # Backend API — no trailing slash so /api/profiles/... goes to 5050 as /api/profiles/...
    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket (online status, chat)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files (avatars, chat attachments) — must proxy to backend
    location /uploads/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Vite dev server)
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
