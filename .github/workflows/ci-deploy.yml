name: Marketplace CI and deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kadena_nexus
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kadena_nexus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kadena_nexus
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize disposable test database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f server/schema.sql

      - name: Build frontend
        run: npm run build

      - name: Run database hardening acceptance tests
        run: npm run test:db-hardening

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    concurrency:
      group: marketplace-production-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out source for deployment tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare restricted SSH connection
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          89.167.14.58 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEmNdcA2rlIHynqX/PNVjT+fDPFVwmhc1WDE6QN0kLel
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy Marketplace frontend
        id: remote_deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SCRIPT: ${{ secrets.DEPLOY_SCRIPT }}
        run: |
          set -euo pipefail
          test "$DEPLOY_HOST" = "89.167.14.58"
          test "$DEPLOY_USER" = "deployer"
          test "$DEPLOY_SCRIPT" = "/usr/local/bin/deploy-marketplace"

          if ! deploy_output="$(ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo -n /usr/local/bin/deploy-marketplace' 2>&1)"; then
            printf '%s\n' "$deploy_output"
            exit 1
          fi

          printf '%s\n' "$deploy_output"
          deployed_short_sha="$(printf '%s\n' "$deploy_output" \
            | sed -nE 's/^Marketplace deployment succeeded at ([0-9a-f]{7,40})\..*/\1/p' \
            | tail -n 1)"
          if [[ ! "$deployed_short_sha" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "Could not read the deployed commit from the server response." >&2
            exit 1
          fi
          echo "deployed_short_sha=$deployed_short_sha" >> "$GITHUB_OUTPUT"

      - name: Tag deployed commit
        env:
          DEPLOYED_SHORT_SHA: ${{ steps.remote_deploy.outputs.deployed_short_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          deployed_sha="$(git rev-parse --verify "${DEPLOYED_SHORT_SHA}^{commit}")"
          tag="deploy-marketplace-$(date -u +%F-%H%M)-${DEPLOYED_SHORT_SHA}"
          git tag "$tag" "$deployed_sha"
          git push origin "refs/tags/$tag"
