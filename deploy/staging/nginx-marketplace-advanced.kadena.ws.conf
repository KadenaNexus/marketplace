# nginx for marketplace-advanced.kadena.ws (the v11 preview).
# setup.sh installs this as /etc/nginx/sites-available/marketplace-advanced.kadena.ws and runs certbot,
# which adds the HTTPS server block and the HTTP -> HTTPS redirect.
#
# The site is the built frontend (static files in /var/www/marketplace-advanced.kadena.ws).
# The API runs under PM2 as kadena-advanced-server on 127.0.0.1:5060.
# marketplace.kadena.ws (8081 / 5050) is not touched.

server {
    listen 80;
    listen [::]:80;
    server_name marketplace-advanced.kadena.ws;

    root /var/www/marketplace-advanced.kadena.ws;
    index index.html;

    # A preview: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Profile images and chat attachments (max ~5 MB each).
    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://127.0.0.1:5060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5060;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5060;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build files never change; the page and the service worker must always be fresh.
    location /assets/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location = /sw.js {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
